<svg xmlns="http://www.w3.org/2000/svg" viewBox="190 95 675 395" role="img" aria-label="Símbolo PEIA-HPC: asa ascendente e grafo de nós">
  <title>PEIA-HPC · símbolo Asa-Nó</title>
  <!-- Asa: traços azuis ascendentes (14-Bis de Santos Dumont / camadas de rede) -->
  <g fill="none" stroke-linecap="round">
    <path d="M210 470 C 360 470, 520 400, 630 270" stroke="#0072B2" stroke-width="22"/>
    <path d="M252 448 C 390 448, 540 382, 636 262" stroke="#2C86C0" stroke-width="17"/>
    <path d="M300 432 C 430 432, 560 372, 640 258" stroke="#5AA3D0" stroke-width="13"/>
    <path d="M356 408 C 470 408, 578 360, 642 255" stroke="#8FC0E0" stroke-width="9"/>
  </g>
  <!-- Arestas do grafo (nós de computação do SDumont) -->
  <g fill="none" stroke-linecap="round">
    <line x1="648" y1="250" x2="660" y2="150" stroke="#009E73" stroke-width="6"/>
    <line x1="648" y1="250" x2="760" y2="290" stroke="#009E73" stroke-width="6"/>
    <line x1="648" y1="250" x2="770" y2="185" stroke="#009E73" stroke-width="5"/>
    <line x1="660" y1="150" x2="770" y2="185" stroke="#66C2A9" stroke-width="5"/>
    <line x1="770" y1="185" x2="835" y2="120" stroke="#E69F00" stroke-width="6"/>
  </g>
  <!-- Nós: azul (hub) + verde-azulado + âmbar (acento assimétrico) -->
  <g>
    <circle cx="648" cy="250" r="20" fill="#0072B2"/>
    <circle cx="660" cy="150" r="15" fill="#009E73"/>
    <circle cx="770" cy="185" r="15" fill="#009E73"/>
    <circle cx="760" cy="290" r="13" fill="#009E73"/>
    <circle cx="835" cy="120" r="18" fill="#E69F00"/>
  </g>
</svg>
